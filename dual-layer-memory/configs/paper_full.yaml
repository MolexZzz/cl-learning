# Paper-scale configuration (real Qwen3 + ZsRE).
#
# Hardware used by the paper: one node with 4 x NVIDIA H20 (96 GB each).
# Cost: behavioural labelling is 2 x 6,040,560 greedy generations with
# qwen3-8B (the long pole), feature extraction is 201k facts x (1.7B + 8B),
# streaming evaluation is ~1M generations per policy on the 8B model, and
# write-back is LoRA SFT of both backbones followed by a second labelling pass.
#
# Prerequisites:
#   1. ZsRE dump under data/zsre (see docs/DATASET.md)
#   2. pip install -r requirements-gpu.txt
#   3. python scripts/check_gpu.py
#   4. python -m dlmem.cli run-all --config configs/paper_full.yaml
run_name: paper_full
seed: 13

paths:
  data_dir: data
  out_dir: runs

model:
  small: Qwen/Qwen3-1.7B
  large: Qwen/Qwen3-8B
  dtype: bfloat16
  device: auto
  device_map: auto
  feature_max_length: 256
  qa_max_length: 768
  prompt_batch_size: 16
  generate_batch_size: 32
  max_new_tokens: 16
  trust_remote_code: true
  attn_implementation: sdpa
  chat_template: true

data:
  zsre_path: data/zsre
  hf_name: ""
  hf_config: ""
  m_probes: 30
  max_facts: 0
  splits: [0.7, 0.15, 0.15]

labeling:
  batch_size: 64
  max_probes_per_fact: 0

features:
  pooling: mean
  interp_len: 64
  batch_size: 64

router:
  hidden: 512
  depth: 2
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.01
  epochs: 60
  batch_size: 512
  patience: 10
  loss: mse
  lambda_s: 0.2
  feature_mode: semantic_uncertainty
  large_feature_mode: semantic_uncertainty
  calibration: none

gate:
  hidden: 256
  depth: 2
  dropout: 0.1
  lr: 0.001
  epochs: 60
  batch_size: 512
  lambda_e: 0.008
  feature_mode: full
  supervision: train
  oversample: 8

cascade:
  escalation_cap: 0.45

sweep:
  lambda_s: [0.02, 0.05, 0.08, 0.12, 0.16, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.8]
  lambda_e: [0.002, 0.005, 0.008, 0.02]
  escalation_caps: [0.4, 0.6]
  storage_grid: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]

eval:
  split: test
  episodes: 300
  turns: 500
  facts_per_episode: 100
  top_k: 3
  batch_episodes: 16
  tau_flush: 0.5
  operating_points:
    - {lambda_s: 0.2, lambda_e: 0.008}
    - {lambda_s: 0.08, lambda_e: 0.005}
  targets:
    heuristic: 0.59
    ppl: 0.717

sft:
  enabled: true
  source: test
  epochs: 3
  lr: 2.0e-5
  batch_size: 4
  grad_accum: 8
  max_length: 512
  lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  gradient_checkpointing: true
  max_steps: -1
  max_examples: 0
  max_qa_per_fact: 2
  relabel_train: true
  relabel_facts: 0

ablation:
  feature_modes: [semantic, uncertainty, semantic_uncertainty]
  poolings: [mean, last_token]
  losses: [mse, margin_ranking]
  gate_modes: [score_only, semantic, uncertainty_only, semantic_uncertainty, full]
  escalation_caps: [0.4, 0.6]

compute:
  small_cost: 1.0
  large_cost: 4.7
  generation_tokens: 16
